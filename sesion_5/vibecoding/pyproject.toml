[project]
name = "genaidemo"
version = "0.1.0"
requires-python = "==3.12.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "semantic-kernel>=1.11",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "azure-cosmos>=4.7",
    "azure-search-documents>=11.5",
    "azure-mgmt-containerregistry>=10.3",
    "azure-monitor-opentelemetry>=1.6",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "msal>=1.30",
    "fastapi-azure-auth>=5.0",
    "tiktoken>=0.8",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-mock>=3.14",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src", "apps/api/src"]

[tool.coverage.report]
fail_under = 70
