# =============================================================
# HPA — GKE Autopilot (Sesión 7)
# HorizontalPodAutoscaler para el Agente LLM en GKE
# =============================================================
# GKE Autopilot: no gestionas nodos — pagas por pods.
# El Cluster Autoscaler de Autopilot gestiona los nodos
# automáticamente. Solo necesitas configurar el HPA de pods.
#
# Ventaja de GKE Autopilot:
#   - Si el HPA quiere más pods y no hay nodos, GKE Autopilot
#     provisiona nodos en <2 min automáticamente.
#   - No necesitas configurar Cluster Autoscaler manualmente.
# =============================================================

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-agent-hpa
  namespace: llm-prod
  annotations:
    # GKE recomienda usar VPA junto con HPA
    # VPA ajusta los recursos (CPU/RAM request) automáticamente
    autoscaling.alpha.kubernetes.io/conditions: "[]"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-agent-gateway

  minReplicas: 2
  maxReplicas: 20    # GKE Autopilot escala nodos automáticamente

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4           # GKE puede escalar más agresivo
          periodSeconds: 60
        - type: Percent
          value: 100         # O doblar pods
          periodSeconds: 60
      selectPolicy: Max      # Elige la política más agresiva
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
# VPA (Vertical Pod Autoscaler) — recomendaciones automáticas
# GKE Autopilot tiene VPA pre-instalado
# En modo "Off" solo da recomendaciones sin modificar pods
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llm-agent-vpa
  namespace: llm-prod
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-agent-gateway
  updatePolicy:
    updateMode: "Off"   # Solo recomendaciones (no modifica pods en producción)
  resourcePolicy:
    containerPolicies:
      - containerName: llm-agent-gateway
        minAllowed:
          cpu: "200m"
          memory: "256Mi"
        maxAllowed:
          cpu: "2000m"
          memory: "2Gi"

# =============================================================
# Ver recomendaciones VPA:
#   kubectl describe vpa llm-agent-vpa -n llm-prod
#
# Ver HPA en GKE:
#   kubectl get hpa -n llm-prod -w
#
# Dashboard GKE en Cloud Console:
#   Console → Kubernetes Engine → Workloads → llm-agent-gateway
# =============================================================
