# =============================================================
# Kubernetes Local — LLM Agent Gateway (Sesión 7)
# Autoescalado del agente LLM con HPA
# =============================================================
# Prerrequisitos:
#   minikube start --cpus=4 --memory=8192
#   minikube addons enable metrics-server
#   eval $(minikube docker-env)        # Linux/Mac
#   minikube docker-env | Invoke-Expression  # Windows PowerShell
#
# Deploy:
#   kubectl apply -f kubernetes/local/
#
# Monitorear HPA:
#   watch kubectl get hpa,pods -n llm-prod
#
# Generar carga para ver autoescalado:
#   k6 run loadtesting/k6/load-test.js
# =============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-prod
  labels:
    app: llm-agent
    env: local

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-agent-config
  namespace: llm-prod
data:
  ENVIRONMENT: "kubernetes-local"
  LOG_LEVEL: "INFO"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  OLLAMA_DEFAULT_MODEL: "llama3.2:3b"
  ENABLE_CACHE: "true"
  REDIS_URL: "redis://redis-service:6379/0"
  AGENT_MAX_STEPS: "8"
  AGENT_TIMEOUT: "60"
  RATE_LIMIT_PER_MINUTE: "60"

---
# Deployment del LLM Agent Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-agent-gateway
  namespace: llm-prod
  labels:
    app: llm-agent-gateway
    version: "3.0"
spec:
  replicas: 2                   # Mínimo 2 réplicas (alta disponibilidad)
  selector:
    matchLabels:
      app: llm-agent-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0         # Zero downtime durante actualizaciones
  template:
    metadata:
      labels:
        app: llm-agent-gateway
        version: "3.0"
      annotations:
        prometheus.io/scrape: "true"   # Prometheus scrapeará este pod
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: llm-agent-gateway
          image: llm-agent-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: llm-agent-config
          resources:
            requests:
              cpu: "300m"         # 0.3 CPU para el agente (más que una app simple)
              memory: "384Mi"     # Más RAM por la memoria de sesiones del agente
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

---
# Ollama — LLM local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-prod
spec:
  replicas: 1   # Un solo Ollama (modelo siempre en RAM)
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5
              echo "Descargando llama3.2:3b (primera vez: ~2GB)..."
              ollama pull llama3.2:3b
              kill %1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          emptyDir: {}

---
# Redis — cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llm-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: llm-agent-service
  namespace: llm-prod
spec:
  type: NodePort
  selector:
    app: llm-agent-gateway
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: llm-prod
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: llm-prod
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
