# =============================================================
# HPA — HorizontalPodAutoscaler para el Agente LLM
# Sesión 7: Autoescalado bajo carga de pruebas
# =============================================================
# Nota pedagógica:
# El agente LLM consume MÁS CPU que un API Gateway simple porque:
# - Hace múltiples llamadas al LLM por request (pasos ReAct)
# - Mantiene memoria de sesiones en RAM
# - Procesa razonamiento del agente en cada paso
# Por eso el threshold de CPU es más agresivo (60% en vez de 70%)
# =============================================================

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-agent-hpa
  namespace: llm-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-agent-gateway

  minReplicas: 2      # Mínimo 2 para alta disponibilidad
  maxReplicas: 10     # Máximo 10 réplicas bajo carga máxima

  metrics:
    # CPU: threshold más bajo por el alto costo del agente
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # 60% (vs 70% para APIs simples)

    # RAM: el agente usa más por la memoria de sesiones
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # Escalar rápido cuando sube la carga
      policies:
        - type: Pods
          value: 2                       # Agregar hasta 2 pods a la vez
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Esperar 5 min antes de bajar réplicas
      policies:
        - type: Pods
          value: 1                       # Quitar 1 pod a la vez
          periodSeconds: 60

# =============================================================
# Comandos para observar el HPA:
#
# En otra terminal mientras k6 corre:
#   watch -n 2 kubectl get hpa,pods -n llm-prod
#
# Para ver eventos de decisión del HPA:
#   kubectl describe hpa llm-agent-hpa -n llm-prod
#
# Output esperado durante load test:
#   NAME             TARGETS         MINPODS  MAXPODS  REPLICAS
#   llm-agent-hpa   15%/60%   2        10       2      (sin carga)
#   llm-agent-hpa   75%/60%   2        10       4      (con k6)
#   llm-agent-hpa   58%/60%   2        10       4      (estable)
#   llm-agent-hpa   12%/60%   2        10       2      (baja tras 5 min)
# =============================================================
