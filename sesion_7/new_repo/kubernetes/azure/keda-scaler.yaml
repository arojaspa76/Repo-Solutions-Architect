# =============================================================
# KEDA ScaledObject — Agente LLM en AKS (Sesión 7)
# Scale to zero cuando no hay requests al agente
# =============================================================

---
# KEDA HTTP Scaler: escalar a 0 cuando no hay tráfico
# (Requiere: helm install http-add-on kedacore/keda-add-ons-http)
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: llm-agent-http-scaler
  namespace: llm-prod
spec:
  host: llm-agent.bsginstitute.com
  # 1 pod por cada 5 requests pendientes (agente es más lento que API simple)
  targetPendingRequests: 5
  scaledownPeriod: 300           # 5 minutos sin tráfico → scale to zero
  scaleTargetRef:
    name: llm-agent-gateway
    apiVersion: apps/v1
    kind: Deployment
    service: llm-agent-service
    port: 80
  replicas:
    min: 0    # Scale to zero: $0 cuando nadie usa el agente
    max: 15   # Hasta 15 pods en pico

---
# ScaledObject con Prometheus: escalar según latencia del agente
# Si la latencia P95 supera 30s → añadir pods
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm-agent-latency-scaler
  namespace: llm-prod
  annotations:
    keda.sh/disabled: "true"    # Desactivar — usar solo uno de los dos
spec:
  scaleTargetRef:
    name: llm-agent-gateway
  minReplicaCount: 1
  maxReplicaCount: 15
  cooldownPeriod: 180
  triggers:
    # Escalar cuando la latencia P95 del agente supera 20 segundos
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        metricName: agent_p95_latency
        query: |
          histogram_quantile(0.95, 
            sum(rate(agent_duration_seconds_bucket[2m])) by (le)
          )
        threshold: "20"    # 20 segundos de P95 → escalar
    # También escalar si el queue de requests crece
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        metricName: agent_queue_depth
        query: sum(llm_active_connections)
        threshold: "10"
